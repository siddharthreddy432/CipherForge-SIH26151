<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // by making window.fetch writable in case a library or platform script tries to mock it.
      try {
        var originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() { return originalFetch; },
          set: function(newFetch) {
            Object.defineProperty(window, 'fetch', {
              value: newFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        });
      } catch (e) {
        console.warn('Could not redefine window.fetch', e);
      }
    </script>
